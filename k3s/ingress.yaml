apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pigeongram
  namespace: pigeongram
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/websocket-services: "app"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto $scheme;
    nginx.ingress.kubernetes.io/server-snippet: |
      location /stub_status {
          stub_status;
          allow 127.0.0.1;
          allow 10.0.0.0/8;
          deny all;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pigeongram.com.ru
        - test.pigeongram.com.ru
      secretName: pigeongram-tls
  rules:
    - host: test.pigeongram.com.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8080
    - host: pigeongram.com.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8080